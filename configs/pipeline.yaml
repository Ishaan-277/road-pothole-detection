detector:
  model_path: outputs/training/yolo11s_640_baseline/weights/best.pt
  data_yaml: configs/data.yaml
  confidence: 0.20
  candidate_confidence: 0.05
  class_confidence:
    3: 0.10
  nms_iou: 0.70
  agnostic_nms: true
  duplicate_iou: 0.45
  duplicate_ios: 0.80
  image_size: 640
  device: auto

severity:
  enabled: true
  model_path: outputs/severity_classifier/resnet18/best_severity_model.pth
  image_size: 224
  classes:
    - low
    - medium
    - high

output:
  directory: outputs/inference
  save_images: true
  save_csv: true
  save_json: true

video:
  tracker: bytetrack.yaml
  severity_interval_frames: 10
  codec: mp4v
